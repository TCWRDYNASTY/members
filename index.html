<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="manifest.json">

<style>
html { box-sizing: border-box; }
*, *:before, *:after { box-sizing: inherit; }

body {
    margin: 0;
    padding: 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #1e3159;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* --- Header Section --- */
.header {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 3px solid black;
    background-color: #f5f5dc;
    color: black;
    padding: 20px;
    gap: 20px;
    font-family: 'Courier New', monospace;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.logo-container img { width: 100%; max-width: 200px; height: auto; }
.header .title { font-size: clamp(1.5rem, 5vw, 2.8rem); font-weight: 800; text-transform: uppercase; }
.header .subtitle { font-size: clamp(1.2rem, 3vw, 2rem); letter-spacing: 2px; }

/* --- Grid Layout (The Fix) --- */
.column-container { 
    display: grid; 
    /* Creates 3 equal columns on desktop */
    grid-template-columns: repeat(3, 1fr); 
    gap: 25px; 
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
}

.column-left, .column-center, .column-right, .column-retired { 
    display: flex; 
    flex-direction: column; 
    gap: 20px;
}

/* --- Manager Cards --- */
.champ {
    background-color: #2d3748;
    text-align: center;
    margin: 0; /* Let the grid handle the spacing */
    border: 4px solid #4a5568;
    border-radius: 12px; 
    width: 100%; /* Fill the grid column */
    max-width: 300px;
    height: 300px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 !important;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
    justify-self: center; /* Center cards if column is wider than card */
}

.champ:hover {
    transform: translateY(-5px);
    border-color: #FFD700;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.champ-content { display: flex; flex-direction: column; height: 100%; width: 100%; }
.champ-content img { width: 100%; height: 200px; object-fit: cover; display: block; margin: 0; }

.manager-names {
    background-color: #2d3748;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 10px;
    width: 100%;
    border-top: 2px solid #4a5568;
}

.real-name { font-size: 1.2rem; font-weight: 700; color: white; }
.login-name { font-size: 0.9rem; color: #cbd5e0; font-style: italic; margin-top: 2px; }

.retired-stamp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    color: #dc3545;
    font-family: 'Impact', sans-serif;
    font-size: 2.2rem;
    border: 5px solid #dc3545;
    padding: 5px 15px;
    z-index: 10;
    pointer-events: none;
    background-color: rgba(0, 0, 0, 0.4);
}

/* --- Overlay Styles --- */
#full-page-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.95);
    z-index: 10000;
    padding: 40px 20px;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    box-sizing: border-box;
}

.overlay-hidden { display: none !important; }

.overlay-content {
    width: 100%;
    max-width: 1200px;
    background: #111827;
    border: 3px solid #FFD700;
    border-radius: 15px;
    padding: 40px 25px;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
    min-height: min-content;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 50px;
    color: #FFD700;
    cursor: pointer;
    z-index: 10001;
}

/* --- Dossier Grid (Inside Overlay) --- */
.dossier-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
    width: 100%;
}

.dossier-section {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
}

.h2h-scroll { 
    width: 100%; 
}

table { width: 100%; border-collapse: collapse; }

th, td { 
    padding: 10px 4px;   
    text-align: center;  
    border-bottom: 1px solid rgba(255,255,255,0.1); 
}

td:first-child, th:first-child { 
    text-align: left; 
    padding-left: 10px;
}

/* --- Responsive Media Queries --- */
@media (max-width: 1100px) {
    .column-container { 
        /* Switch to 2 columns for smaller laptops/tablets */
        grid-template-columns: repeat(2, 1fr); 
    }
}

@media (max-width: 768px) {
    .column-container { 
        /* Back to 1 column for mobile */
        grid-template-columns: 1fr; 
    }
    .dossier-grid { grid-template-columns: 1fr; }
}
</style>
</head>

async function openOverlay(managerId) {
    const overlay = document.getElementById('full-page-overlay');
    const target = document.getElementById('dossier-target');
    overlay.classList.remove('overlay-hidden');
    
    target.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; width: 100%; color: #FFD700;">
            <p style="font-size: 1.5rem; letter-spacing: 3px; font-family: 'Courier New', monospace;">DECRYPTING DOSSIER...</p>
            <p style="font-size: 0.9rem; color: rgba(255,215,0,0.5);">Accessing Firebase Records for ${managerId}</p>
        </div>`;

    try {
        const doc = await db.collection("managers").doc(managerId).get();
        if (doc.exists) {
            const d = doc.data(); 
            const displayName = d.memberId || managerId; 

            target.innerHTML = `
                <div class="dossier-header">
                    <h1 style="text-align:center; color:#FFD700; font-size: 2.5rem; margin-bottom: 20px;">${displayName}</h1>
                </div>

                <div class="dossier-grid">

                        <div class="dossier-section">

                                <p><strong>Manager Score:</strong> ${d.totalManagerscore || '0.00'}</p>
                                <p><strong>Record:</strong> ${d.careerRecord || '0-0'} (${d.winPct || '0%'})</p>
                                <p><strong>Total Points:</strong> ${d.totalPointsFor || '0.00'}</p>
                                <p><strong>Avg PPG:</strong> ${d.careerAvg || '0.00'}</p>
                                <p><strong>Playoffs:</strong> ${d.playoffAppearances || '0'}</p>
                                <p><strong>Rings:</strong> ${d.championships || '0'} 🏆</p>
                            </div>
                        </div>
                    </div>

                    <div class="dossier-section">
                        <h3 style="color:#FFD700; margin-top:0; border-bottom:1px solid #FFD700; padding-bottom:5px;">Head-to-Head History</h3>
                        <div class="h2h-scroll">
                            <table style="font-size: 0.9rem;">
                                <thead style="position: sticky; top: 0; background: #1a202c; color: gold;">
                                    <tr><th>Opponent</th><th>Rec</th><th>Total PF</th><th>Avg</th><th>Diff</th></tr>
                                </thead>

                            </table>
                        </div>
                    </div>

}

function generateH2HRows(managerId) {
    const data = managerDataStore[managerId] || managerDataStore["Default"];
    return data.map(r => `
        <tr>
            <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
            <td style="font-weight:bold; color:${r[4].startsWith('+') ? '#4ade80' : '#f87171'}">${r[4]}</td>
        </tr>`).join('');
}

function closeOverlay() {
    document.getElementById('full-page-overlay').classList.add('overlay-hidden');
}
