<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members</title>
    <link rel="manifest" href="manifest.json">

<style>
/* --- BASE RESET --- */
html { box-sizing: border-box; }
*, *:before, *:after { box-sizing: inherit; }

body {
    margin: 0;
    padding: 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #1e3159;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* --- HEADER --- */
.header {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 3px solid black;
    background-color: #f5f5dc;
    color: black;
    padding: 20px;
    gap: 20px;
    font-family: 'Courier New', monospace;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.logo-container img { width: 100%; max-width: 200px; height: auto; }
.header .title { font-size: clamp(1.5rem, 5vw, 2.8rem); font-weight: 800; text-transform: uppercase; }
.header .subtitle { font-size: clamp(1.2rem, 3vw, 2rem); letter-spacing: 2px; }

/* --- MANAGER CARDS --- */
.champ {
    background-color: #2d3748;
    text-align: center;
    margin: 0 auto 20px auto; 
    border: 4px solid #4a5568;
    border-radius: 12px; 
    width: 260px; 
    height: 300px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 !important;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
}

.champ:hover {
    transform: translateY(-5px);
    border-color: #FFD700;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.champ-content { display: flex; flex-direction: column; height: 100%; width: 100%; }
.champ-content img { width: 100%; height: 200px; object-fit: cover; display: block; margin: 0; }

.manager-names {
    background-color: #2d3748;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 10px;
    width: 100%;
    border-top: 2px solid #4a5568;
}

.real-name { font-size: 1.2rem; font-weight: 700; color: white; }
.login-name { font-size: 0.9rem; color: #cbd5e0; font-style: italic; margin-top: 2px; }

/* --- RETIRED STAMP --- */
.retired-stamp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    color: #dc3545;
    font-family: 'Impact', sans-serif;
    font-size: 2.2rem;
    border: 5px solid #dc3545;
    padding: 5px 15px;
    z-index: 10;
    pointer-events: none;
    background-color: rgba(0, 0, 0, 0.4);
}

/* --- LAYOUT --- */
.column-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
.column-left, .column-center, .column-right, .column-retired { flex: 1 1 300px; padding: 10px; display: flex; flex-direction: column; }

/* --- OVERLAY --- */
#full-page-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.95);
    z-index: 10000;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
}

.overlay-hidden { display: none !important; }

.overlay-content {
    width: 100%;
    max-width: 1200px;
    background: #111827;
    border: 3px solid #FFD700;
    border-radius: 15px;
    padding: 40px 25px;
    margin: auto;
    position: relative;
    box-sizing: border-box;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 50px;
    color: #FFD700;
    cursor: pointer;
    z-index: 10001;
}

.dossier-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
    width: 100%;
}

.dossier-section {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
}

.h2h-scroll { max-height: 450px; overflow-y: auto; width: 100%; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }

@media (max-width: 900px) {
    .dossier-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo-container"><img src="DYNASTYLOGO.jpeg" alt="logo"></div>
    <div class="header-text">
        <p class="title">TCWR Dy-NASTY League</p>
        <p class="subtitle">Members</p>
    </div>
</div>

<div class="column-container">
    <div class="column-left">
        <div class="champ" id="AnNguyen" onclick="openOverlay('AnNguyen')">
            <div class="champ-content">
                <img src="brody2.JPG" alt="An Nguyen">
                <div class="manager-names">
                    <span class="real-name">An Nguyen</span>
                    <span class="login-name">"TB12isDaddy"</span>
                </div>
            </div>
        </div>
        <div class="champ" id="drvargas" onclick="openOverlay('drvargas')">
            <div class="champ-content">
                <img src="Brody.JPG" alt="Steven Vargas">
                <div class="manager-names">
                    <span class="real-name">Steven Vargas</span>
                    <span class="login-name">"drvargas"</span>
                </div>
            </div>
        </div>
    </div> 
</div>

<div id="full-page-overlay" class="overlay-hidden">
    <div class="overlay-content">
        <span class="close-btn" onclick="closeOverlay()">&times;</span>
        <div id="dossier-target"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
let db = null;

window.onload = function() {
    const firebaseConfig = {
        apiKey: "AIzaSyCZYJeAJjeiaUoV2s1NBjGXVYOJtixh-qk",
        authDomain: "tcwr-dynasty.firebaseapp.com",
        projectId: "tcwr-dynasty",
        storageBucket: "tcwr-dynasty.firebasestorage.app",
        messagingSenderId: "544187199777",
        appId: "1:544187199777:web:05753208f1daee32558e60"
    };

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
};

async function openOverlay(managerId) {
    const overlay = document.getElementById('full-page-overlay');
    const target = document.getElementById('dossier-target');
    
    overlay.classList.remove('overlay-hidden');
    target.innerHTML = `<p style="text-align:center; color:#FFD700; padding:40px;">Decrypting Dossier...</p>`;

    try {
        const doc = await db.collection("managers").doc(managerId).get();
        if (doc.exists) {
            const d = doc.data(); 
            const displayName = d.memberId || managerId; 

            target.innerHTML = `
                <div class="dossier-header">
                    <h1 style="text-align:center; color:#FFD700; font-size: 2.5rem;">${displayName}</h1>
                </div>

                <div class="dossier-grid" style="grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));">
                    <div class="dossier-stack" style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="dossier-section">
                            <h3 style="color:#FFD700; margin-top:0; border-bottom:1px solid #FFD700; padding-bottom:5px;">Manager Stats</h3>
                            <div style="font-size: 0.9rem; line-height: 1.8; color:white;">
                                <p><strong>Rank:</strong> #${d.rank || 'N/A'}</p>
                                <p><strong>Score:</strong> ${d.score || '0.00'}</p>
                                <p><strong>Record:</strong> ${d.record || '0-0'}</p>
                                <p><strong>Total Points:</strong> ${d.totalPoints || '0.00'}</p>
                                <p><strong>Avg PPG:</strong> ${d.avgPPG || '0.00'}</p>
                                <p><strong>Playoffs:</strong> ${d.playoffs || '0'}</p>
                                <p><strong>Rings:</strong> ${d.rings || '0'} 🏆</p>
                            </div>
                        </div>

                        <div class="dossier-section">
                            <h3 style="color:#FFD700; margin-top:0; border-bottom:1px solid #FFD700; padding-bottom:5px;">Matchup Intel</h3>
                            <table style="font-size: 0.85rem;">
                                <tr style="color:gold; font-size:0.75rem;"><th>Category</th><th>Manager</th></tr>
                                <tr><td><b>The Brick Wall</b></td><td>${d.brickWall || 'TBD'}</td></tr>
                                <tr><td><b>Smoke & Mirrors</b></td><td>${d.smokeMirrors || 'TBD'}</td></tr>
                                <tr><td><b>The Cardiac Kid</b></td><td>${d.cardiacKid || 'TBD'}</td></tr>
                                <tr><td><b>Murphy’s Law</b></td><td>${d.murphysLaw || 'TBD'}</td></tr>
                                <tr><td><b>Reality Check</b></td><td>${d.realityCheck || 'TBD'}</td></tr>
                            </table>
                        </div>
                    </div>

                    <div class="dossier-section">
                        <h3 style="color:#FFD700; margin-top:0; border-bottom:1px solid #FFD700; padding-bottom:5px;">Head-to-Head History</h3>
                        <div class="h2h-scroll">
                            <table style="font-size: 0.9rem;">
                                <thead style="position: sticky; top: 0; background: #1a202c; color: gold;">
                                    <tr>
                                        <th>Opponent</th><th>Rec</th><th>Total PF</th><th>Avg</th><th>Diff</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${generateH2HRows()} 
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 25px; padding: 25px; background: white; border-radius: 20px; border: 3px solid #FFD700; color: #1a202c;">
                    <h4 style="text-align:center; text-transform:uppercase; margin-top:0; border-bottom:1px solid #ddd; padding-bottom:10px; font-weight: 800;">Match Up Intel Key</h4>
                    <div style="font-size: 0.9rem; line-height: 1.6; color: #333;">
                        <p><strong>The Brick Wall:</strong> The team that is a barricade to the manager's success.</p>
                        <p><strong>Smoke and Mirrors:</strong> The average scoring might not be the highest in the league, but their win-loss record tells a completely different story.</p>
                        <p><strong>Cardiac Kid:</strong> Every matchup is a nail-biter. They have a winning record, but their point differential is razor-thin.</p>
                        <p><strong>Murphy’s Law:</strong> Puts up massive points every single week, only to have their opponent put up a better performance.</p>
                        <p><strong>Reality Check:</strong> The opponent that most consistently scores their season average against you.</p>
                    </div>
                </div>
            `;
        }
    } catch (e) { console.error(e); }
}

function generateH2HRows() {
    const data = [
        ["@EmMack","1–2","233.02","77.67","-77.16"],
        ["@bcanfield0913","3–1","501.52","125.38","+29.30"],
        ["@drvargas","2–2","438.42","109.61","+1.92"],
        ["@mgreg00x","3–1","491.40","122.85","+66.12"],
        ["@DawgPound247","1–2","305.12","101.71","-14.26"],
        ["@dudenamedtrevor","1–2","336.36","112.12","-73.34"],
        ["@BUNNIESUPBUDDY","0–3","334.24","111.41","-125.24"],
        ["@CrazyCougars","1–2","303.26","101.09","+6.02"],
        ["@lightmyBONfire","0–3","251.20","83.73","-110.32"],
        ["@SanDiegoSuperBurgers","2–1","378.08","126.03","+22.50"],
        ["@Waddlepenguin","1–2","282.98","94.33","-18.08"],
        ["@LycaonPictus","0–2","156.92","78.46","-18.20"],
        ["@TheBeardedVet","1–1","201.38","100.69","+3.64"],
        ["@kscarney24","1–0","164.36","164.36","+71.10"],
        ["@dianne399","0–1","100.10","100.10","-16.02"]
    ];
    return data.map(r => `
        <tr>
            <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
            <td style="font-weight:bold; color:${r[4].startsWith('+') ? '#4ade80' : '#f87171'}">${r[4]}</td>
        </tr>`).join('');
}

function closeOverlay() {
    document.getElementById('full-page-overlay').classList.add('overlay-hidden');
}
</script>
</body>
</html>
